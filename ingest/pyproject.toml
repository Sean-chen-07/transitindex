[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transitindex-ingest"
version = "0.1.0"
description = "TransitIndex ingestion pipeline (writes core.* in Postgres)"
requires-python = ">=3.13"

# Real-I/O dependencies are OPTIONAL at test time. The core logic (contract,
# refdata, periods, repository protocol, in-memory repo, jobs) imports ONLY the
# Python stdlib, so the test suite runs green without any of these installed.
# Install them only when wiring a real DB / LLM / PDF / HTTP path:
#   psycopg[binary]   -> db/postgres.py (writes Postgres)
#   anthropic         -> LLM-assisted extraction
#   pdfplumber        -> PDF table extraction
#   fastapi, httpx    -> review API / source fetching
#   python-dotenv     -> config.py .env loading (has a stdlib fallback)
# Pinned versions live in requirements.txt.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
