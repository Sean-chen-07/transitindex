# TransitIndex — per-metric data dictionary (single source of truth).
#
# This file is hand-authored. It drives the human doc (docs/reference/data-dictionary.md),
# the PDF-extraction prompts, the FOI request templates, and the workbook's
# inline definitions, via ingest/transitindex_ingest/dictionary.py.
#
# unit / unit_type / is_derived / formula are NOT stored here -- they come from
# refdata.METRICS + the equation catalog so they cannot drift. Keep one entry
# per metric in refdata.METRICS (a parity test enforces this).
#
# source_tier: statcan | open_data | annual_report | foi | derived
# Quote list items (transit terms contain ':' which YAML would misread as a map).

metrics:
  ridership:
    display_name: Ridership
    plain_meaning: Boardings (unlinked passenger trips), at the period shown.
    definition: >-
      The number of unlinked passenger trips (boardings) on the system. One rider counts as
      one trip each time they board a vehicle, so a journey with one transfer is two
      boardings. Held at whatever period the source reports — monthly, quarterly, or annual —
      with the annual figure being the sum of the twelve months when all twelve are present.
    is_not: >-
      NOT the number of distinct people (riders), and NOT linked trips/journeys (a journey
      with a transfer is one journey but two boardings). NOT fare-paying passengers only —
      it includes transfers, passes, and free riders unless a source explicitly says otherwise.
    source_tier: statcan
    period_semantics: >-
      Native monthly for most large agencies (StatCan 23-10-0307) and quarterly/annual
      elsewhere. Period granularity is a DIMENSION of the value, not part of the metric name:
      the same `ridership` metric holds monthly, quarterly, and annual values. Annual = sum of
      the twelve calendar/fiscal months; an incomplete year is a partial year-to-date value,
      never a full year, and a year-to-date value is never ranked against full years.
    includes:
      - "All boardings across all modes (bus, rail, ferry, paratransit) unless scoped"
      - "Transfers, pass holders, concession and free riders"
    excludes:
      - "Distinct-rider counts"
      - "Linked journeys (a transfer trip counted once)"
      - "Year-to-date cumulative totals stored as a monthly value"
    labels_en:
      - "Ridership"
      - "Boardings"
      - "Revenue passengers"
      - "Unlinked passenger trips"
      - "Total passenger trips"
    labels_fr:
      - "Achalandage"
      - "Déplacements"
      - "Montées (déplacements non liés)"
      - "Voyages"
    report_location: >-
      Operating/ridership statistics table near the front of the annual report, the CEO/board
      ridership update, agency open-data feeds, or StatCan table 23-10-0307.
    confusions:
      - "Unlinked (boardings) vs linked (journeys) — TransitIndex wants UNLINKED boardings"
      - "Boardings vs distinct riders — these are not the same number"
      - "Calendar year vs fiscal year — Metrolinx and BC Transit report Apr–Mar"
      - "Revenue-passenger counts that exclude transfers/free riders vs total boardings"
      - "A single month vs a year-to-date cumulative figure reported mid-year"
      - "A single mode's ridership (bus-only, subway-only) is a COMPONENT, not the system total — record it with service_scope='mode_subset', never as the total"

  revenue_service_hours:
    display_name: Revenue Service Hours
    plain_meaning: Hours vehicles spent in service carrying (or available to carry) passengers.
    definition: >-
      The total hours vehicles operated in revenue service — i.e. on a published route
      available to carry passengers. The standard denominator for service-productivity and
      cost-per-hour measures.
    is_not: >-
      NOT total vehicle hours: it EXCLUDES deadhead (pull-in/pull-out), layover where defined
      out, training, and maintenance movements. NOT platform hours unless the agency defines
      them identically.
    source_tier: annual_report
    period_semantics: >-
      Usually annual; a few agencies publish it monthly/quarterly. Annual is the sum of the
      reported sub-periods.
    includes:
      - "In-service revenue operation across all revenue modes"
    excludes:
      - "Deadhead / non-revenue movements"
      - "Garage, training, and maintenance hours"
    labels_en:
      - "Revenue service hours"
      - "Revenue vehicle hours"
      - "In-service hours"
      - "Service hours"
    labels_fr:
      - "Heures de service en ligne"
      - "Heures-véhicules en service"
      - "Heures de service productives"
    report_location: >-
      Operating statistics / service-supplied table in the annual report; sometimes a
      service-standards or performance appendix.
    confusions:
      - "Revenue (in-service) hours vs total vehicle hours that include deadhead"
      - "Vehicle hours vs platform/operator hours"
      - "A single mode's hours (bus-only, rail-only) is a COMPONENT, not the system total — record it with service_scope='mode_subset', never as the total"

  vehicle_revenue_km:
    display_name: Vehicle Revenue Kilometres
    plain_meaning: Distance vehicles travelled while in passenger service.
    definition: >-
      The total kilometres vehicles travelled in revenue service (available to carry
      passengers). A measure of service supplied by distance.
    is_not: >-
      NOT total fleet kilometres: EXCLUDES deadhead and non-revenue travel. NOT
      passenger-kilometres (distance travelled by passengers).
    source_tier: annual_report
    period_semantics: "Usually annual; annual is the sum of any reported sub-periods."
    includes:
      - "In-service revenue distance across revenue modes"
    excludes:
      - "Deadhead / non-revenue kilometres"
      - "Passenger-kilometres travelled"
    labels_en:
      - "Vehicle revenue kilometres"
      - "Revenue vehicle kilometres"
      - "In-service kilometres"
    labels_fr:
      - "Kilomètres parcourus en service"
      - "Véhicules-kilomètres en service"
    report_location: "Operating statistics / service-supplied table in the annual report."
    confusions:
      - "Revenue km vs total km including deadhead"
      - "Vehicle-kilometres vs passenger-kilometres"
      - "A single mode's km (bus-only, rail-only) is a COMPONENT, not the system total — record it with service_scope='mode_subset', never as the total"

  on_time_performance:
    display_name: On-Time Performance
    plain_meaning: Share of scheduled service that ran on time.
    definition: >-
      The percentage of trips (or stops/departures) that met the agency's on-time definition.
      A service-quality measure, reported as a percentage.
    is_not: >-
      NOT a single universal standard — each agency defines its own on-time window (e.g. 0 to
      +3 min, or ±1 min), and rail vs bus windows differ. NOT a count; it is a ratio.
    source_tier: annual_report
    period_semantics: "Monthly to quarterly for large agencies; annual otherwise."
    includes:
      - "The agency's own on-time definition (record it in notes)"
    excludes:
      - "Cancelled trips unless the agency counts them as late"
    labels_en:
      - "On-time performance"
      - "OTP"
      - "Schedule adherence"
      - "Service reliability"
    labels_fr:
      - "Ponctualité"
      - "Taux de ponctualité"
      - "Respect de l'horaire"
    report_location: "Customer/service-performance or KPI scorecard section."
    confusions:
      - "On-time window differs by agency and by mode (±1 vs +3 vs +5 minutes)"
      - "Schedule adherence vs headway adherence (frequent service measures headway gaps)"
      - "A single mode's OTP (bus-only, rail-only) is a COMPONENT, not the system-wide figure — record it with service_scope='mode_subset', never as the total"

  total_revenue_excluding_subsidy:
    display_name: Total revenue excluding subsidy
    plain_meaning: Money earned from fares and other operations (excludes subsidy).
    definition: >-
      Revenue the agency earns from operations — passenger fares plus ancillary operating
      income (advertising, charters, fees). NOT the numerator of farebox recovery or
      average fare — those use farebox_revenue (fares only) so they don't inflate for
      capital-heavy agencies.
    is_not: >-
      NOT total revenue: it EXCLUDES government operating subsidy/funding and capital
      contributions. NOT fares only when ancillary income exists, and NOT gross of refunds.
      NOT a component line promoted to the total — it is defined exactly as
      total_revenue − subsidy (StatCan 23-10-0307), never sourced by picking one revenue
      line and calling it the whole.
    source_tier: statcan
    entity_scope: >-
      Company-wide: the whole reporting organization's earned revenue from the audited
      financial statements — conventional + specialized/paratransit + every business line.
      Never a transit-segment or conventional-only carve-out. For multi-division agencies
      (TransLink incl. roads/bridges, Metrolinx incl. GO + UP + PRESTO) use the audited entity
      total. For a transit division inside a city (Calgary Transit, Edmonton ETS, Hamilton HSR)
      use the transit division's own schedule, never the municipality-wide total.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: >-
      Monthly for the farebox portion at large agencies (StatCan); the full figure is usually
      annual from the audited statement of operations.
    includes:
      - "Passenger fare revenue (cash, passes, concessions)"
      - "Ancillary operating income (advertising, charter, fees)"
    excludes:
      - "Government operating subsidy and funding transfers"
      - "Capital grants and contributions"
    labels_en:
      - "Operating revenue"
      - "Revenue from operations"
      - "Fare revenue (subset)"
      - "Passenger revenue (subset)"
    labels_fr:
      - "Revenus d'exploitation"
      - "Produits d'exploitation"
      - "Recettes tarifaires (sous-ensemble)"
    report_location: >-
      Statement of operations / income statement in the audited financial statements; fare
      revenue alone appears in StatCan and farebox tables.
    confusions:
      - "Operating revenue (earned) vs total revenue that includes government subsidy"
      - "Fares-only vs fares + ancillary income — operating revenue is the broader earned figure"
      - "farebox_revenue (fares only, a COMPONENT) vs total_revenue_excluding_subsidy (the broader earned total) — never record the fares-only line as this total"
      - "One Fare / U-Pass / fare-program reimbursements are SUBSIDY, not part of this earned line — they never widen total_revenue_excluding_subsidy"

  operating_expenses:
    display_name: Operating Expenses
    plain_meaning: Total cost to run the service for the period.
    definition: >-
      The total cost of operating the service over the period — labour, energy/fuel,
      materials and contracted services, and other operating costs. The denominator of
      farebox recovery and the cost-efficiency ratios.
    is_not: >-
      NOT total expenses including capital: typically EXCLUDES capital expenditure. Watch
      AMORTIZATION/DEPRECIATION — PSAB statements of operations INCLUDE it, while CUTA-style
      operating cost EXCLUDES it. Record the structured cost_basis: 'psab_total' when the figure
      is an audited statement-of-operations total (amortization included), 'operating' when the
      source states amortization is excluded. The efficiency ratios use the operating basis;
      never fold amortization into a component line to make it fit. NOT any single object-class
      line (labour, energy/fuel, materials & services) promoted to the total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's operating cost from the audited
      financial statements — conventional + specialized/paratransit + every business line.
      Never a transit-segment or conventional-only carve-out. For multi-division agencies use
      the audited entity total; for a transit division inside a city use the transit division's
      own schedule, never the municipality-wide total.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual for most; quarterly for a few (TransLink, OC Transpo, Calgary)."
    includes:
      - "Labour, energy/fuel, materials and contracted services, other operating costs"
    excludes:
      - "Capital expenditure"
      - "Amortization/depreciation when an operating (CUTA) basis is used"
    labels_en:
      - "Operating expenses"
      - "Operating costs"
      - "Total operating expenditure"
      - "Cost of service"
    labels_fr:
      - "Charges d'exploitation"
      - "Dépenses d'exploitation"
      - "Coûts d'exploitation"
    report_location: "Statement of operations / income statement; operating budget tables."
    confusions:
      - "Operating vs total expenses that fold in capital"
      - "Amortization included (PSAB) vs excluded (CUTA operating basis) — changes farebox recovery"
      - "labour_cost / energy_fuel_cost / materials_services_cost / amortization / other_operating_expenses are COMPONENTS — never record one object-class line as this total"

  subsidy:
    display_name: Subsidy
    plain_meaning: Government funding covering the gap between operating cost and revenue.
    definition: >-
      Total government operating funding that covers the shortfall between operating expenses
      and operating revenue (municipal + provincial + federal operating contributions).
    is_not: >-
      NOT total government funding: EXCLUDES capital grants. NOT a single level of government —
      it is the combined operating contribution. Equal to operating expenses minus operating
      revenue when both are on the same basis. NOT a single named program or funding source
      promoted to the total: a line naming ONE level of government or ONE program ("federal gas
      tax", "provincial operating grant", "municipal contribution", "Safe Restart") is a
      COMPONENT, never the combined total — record subsidy only from a line that is the combined
      total, or leave it for the identity (operating_expenses − total_revenue_excluding_subsidy)
      to solve. Never sum components yourself and never promote one level/program to the total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's combined operating subsidy from the
      audited financial statements — conventional + specialized/paratransit + every business
      line. Never a transit-segment or conventional-only carve-out. For a transit division
      inside a city, use the transit division's own schedule, never the municipality-wide total.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual."
    includes:
      - "Municipal, provincial, and federal OPERATING contributions, combined into one figure"
    excludes:
      - "Capital grants and contributions"
      - "A single level of government's share, or a single named program, reported alone"
    labels_en:
      - "Operating subsidy"
      - "Net operating funding"
      - "Government operating contribution"
      - "Municipal/provincial operating funding"
    labels_fr:
      - "Subvention d'exploitation"
      - "Contribution gouvernementale d'exploitation"
      - "Financement public d'exploitation"
    report_location: >-
      Statement of operations (as funding/contributions) or the funding-sources note; municipal
      budget transfer line.
    confusions:
      - "Operating subsidy vs total funding that includes capital grants"
      - "One government's share (federal gas tax, provincial operating grant, municipal contribution, Safe Restart) vs the combined operating contribution — a single-level/single-program line is a COMPONENT, never the total"
      - "One Fare / U-Pass / fare-program reimbursements are SUBSIDY, not farebox_revenue — do not leave them out of subsidy or fold them into fares"

  labour_cost:
    display_name: Labour Cost
    plain_meaning: Wages, salaries, and benefits for staff.
    definition: >-
      Total employee compensation in operating cost — wages and salaries plus benefits
      (pension, health, payroll taxes). Usually the largest operating-cost line.
    is_not: >-
      NOT wages only when the source includes benefits, and NOT operator wages only — it is
      all-staff compensation unless scoped. NOT contracted-service labour (that sits in
      materials & services). It is a COMPONENT of operating_expenses, never the total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's labour cost from the audited financial
      statements — every business line, never a transit-segment carve-out. For a transit
      division inside a city, use the transit division's own schedule.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual."
    includes:
      - "Wages, salaries, overtime"
      - "Benefits: pension, health, payroll taxes"
    excludes:
      - "Contracted-out service labour (in materials & services)"
    labels_en:
      - "Labour"
      - "Wages, salaries and benefits"
      - "Employee compensation"
      - "Salaries and benefits"
    labels_fr:
      - "Coûts de main-d'œuvre"
      - "Salaires et avantages sociaux"
      - "Rémunération"
    report_location: "Expenses-by-object note in the audited financial statements; budget detail."
    confusions:
      - "Wages only vs wages + benefits"
      - "Operator labour vs all-staff labour"
      - "In-house labour vs contracted-service labour"
      - "A COMPONENT of operating_expenses vs the operating_expenses total itself"

  energy_fuel_cost:
    display_name: Energy & Fuel Cost
    plain_meaning: Spending on fuel and electricity to move the vehicles.
    definition: >-
      The cost of traction energy — diesel/CNG fuel and electricity for trolley, rail, and
      battery-electric vehicles.
    is_not: >-
      NOT facility/building energy unless the source bundles it (note if so). NOT a fuel
      volume — it is a dollar figure. It is a COMPONENT of operating_expenses, never the total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's energy/fuel cost from the audited
      financial statements — every business line, never a transit-segment carve-out. For a
      transit division inside a city, use the transit division's own schedule.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual."
    includes:
      - "Vehicle fuel (diesel, CNG)"
      - "Traction electricity (rail, trolley, battery-electric)"
    excludes:
      - "Facility/building heating and power unless bundled by the source"
    labels_en:
      - "Energy and fuel"
      - "Fuel and energy"
      - "Diesel and electricity"
      - "Traction power"
    labels_fr:
      - "Carburant et énergie"
      - "Énergie"
      - "Carburant"
    report_location: "Expenses-by-object note in the audited financial statements."
    confusions:
      - "Vehicle traction energy vs facility energy"
      - "Dollar cost vs litres/kWh consumed"
      - "A COMPONENT of operating_expenses vs the operating_expenses total itself"

  materials_services_cost:
    display_name: Materials & Services Cost
    plain_meaning: Maintenance materials plus contracted-out services.
    definition: >-
      Spending on materials/supplies (parts, tyres, lubricants) and purchased/contracted
      services (contracted operations, professional services, utilities other than traction).
    is_not: >-
      NOT capital purchases (those are capital expenditure). NOT labour or energy — it is the
      remaining materials-and-services object class. It is a COMPONENT of operating_expenses,
      never the total, and it should NOT silently absorb figures that belong in
      other_operating_expenses.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's materials & services cost from the
      audited financial statements — every business line, never a transit-segment carve-out.
      For a transit division inside a city, use the transit division's own schedule.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual."
    includes:
      - "Parts, supplies, materials"
      - "Contracted/purchased services, professional fees"
    excludes:
      - "Capital asset purchases"
      - "Labour and traction energy"
    labels_en:
      - "Materials and services"
      - "Supplies and services"
      - "Goods and services"
      - "Materials and supplies"
    labels_fr:
      - "Matériel et services"
      - "Fournitures et services"
      - "Biens et services"
    report_location: "Expenses-by-object note in the audited financial statements."
    confusions:
      - "Operating materials/services vs capital purchases"
      - "Contracted-service labour appears here, not under labour cost"
      - "A COMPONENT of operating_expenses vs the operating_expenses total itself"

  fleet_size:
    display_name: Fleet Size
    plain_meaning: Number of active revenue vehicles in the fleet.
    definition: >-
      The count of active revenue vehicles the agency operates, per mode. A bus is one
      vehicle. For RAIL, count TRAINS, not individual cars: one train (however many cars
      it is made up of) is one unit. Displayed on the detail page grouped into four
      capacity-ordered classes (metric-set-build-plan.md Phase 6): Bus (bus, BRT,
      trolleybus) · Light rail (light rail, streetcar) · Heavy rail (subway) · Commuter
      rail (commuter rail). Ferry, paratransit, and on-demand are excluded from the
      composition (still recorded as fleet_size, just not shown in it).
    is_not: >-
      NOT total vehicles including non-revenue (supervisor cars, work vehicles), and NOT
      stored/retired units. For rail, do NOT count individual cars — a 6-car train is ONE
      unit, not six. NOT seated passenger capacity.
    source_tier: annual_report
    period_semantics: "Annual (point-in-time, usually fiscal year-end)."
    includes:
      - "Active revenue vehicles in service"
      - "For rail: count by TRAIN, not by car"
    excludes:
      - "Non-revenue vehicles (work/supervisor units)"
      - "Stored, retired, or not-yet-commissioned vehicles"
      - "Individual rail cars counted separately from their train"
    labels_en:
      - "Fleet size"
      - "Revenue vehicles"
      - "Active fleet"
      - "Vehicles in service"
    labels_fr:
      - "Parc de véhicules"
      - "Taille du parc"
      - "Véhicules en service"
    report_location: "Fleet/asset profile section or the capital-assets note."
    confusions:
      - "Rail cars vs trains — count TRAINS (one train = one unit), even if the agency's own report counts cars"
      - "Revenue vehicles vs total including non-revenue"
      - "Active fleet vs total owned including stored/retired"
      - "A single mode's count (e.g. just buses) is a COMPONENT of the fleet, not the system total — record it per mode, never as a combined figure claiming to be one mode"
      - >-
        Data caveat (2026-07-01): before this change, rail fleet_size guidance said "count
        cars unless trainsets". Any EXISTING per-mode rail fleet_size value must be
        re-checked against its source before being trusted as a train count — do not
        silently reinterpret a stored car-count as a train-count.

  fleet_average_age:
    display_name: Fleet Average Age
    plain_meaning: Average age of the active vehicles.
    definition: >-
      The average age (in years) of the active revenue fleet — a state-of-good-repair signal.
    is_not: >-
      NOT the oldest vehicle's age and NOT remaining useful life. Lower is generally better.
    source_tier: annual_report
    period_semantics: "Annual (point-in-time)."
    includes:
      - "Active revenue vehicles"
    excludes:
      - "Retired/stored vehicles"
    labels_en:
      - "Average fleet age"
      - "Fleet average age"
      - "Average vehicle age"
    labels_fr:
      - "Âge moyen du parc"
      - "Âge moyen des véhicules"
    report_location: "Fleet/asset profile or state-of-good-repair section."
    confusions:
      - "Average age vs oldest vehicle vs remaining useful life"
      - "Mixing modes with very different lifespans (bus ~12y vs rail ~30y)"
      - "A single mode's average age is a COMPONENT figure, not the fleet-wide average — do not report one mode's age as the whole fleet's"

  accessible_fleet_pct:
    display_name: Accessible Fleet %
    plain_meaning: Share of the active fleet that is wheelchair-accessible.
    definition: >-
      The percentage of the active revenue fleet that is accessible (low-floor or
      ramp/lift-equipped).
    is_not: >-
      NOT the share of accessible STOPS/STATIONS (that is a different accessibility measure),
      and NOT a count — it is a percentage of vehicles.
    source_tier: annual_report
    period_semantics: "Annual (point-in-time)."
    includes:
      - "Low-floor or ramp/lift-equipped revenue vehicles"
    excludes:
      - "Stop/station accessibility"
    labels_en:
      - "Accessible fleet"
      - "Percent accessible vehicles"
      - "Low-floor fleet share"
    labels_fr:
      - "Véhicules accessibles"
      - "Part du parc accessible"
      - "Pourcentage de véhicules accessibles"
    report_location: "Accessibility section or fleet profile of the annual report."
    confusions:
      - "Accessible vehicles vs accessible stops/stations"
      - "Low-floor only vs fully accessible (ramp/lift) definitions"
      - "A single mode's accessible share is a COMPONENT figure, not the fleet-wide percentage"

  capital_expenditure:
    display_name: Capital Expenditure
    plain_meaning: Spending on long-term assets (vehicles, facilities, infrastructure).
    definition: >-
      Spending on long-lived assets in the period — new vehicles, facilities, track, and major
      infrastructure. Distinct from operating cost.
    is_not: >-
      NOT amortization/depreciation (the accounting spread of past capital), and NOT operating
      expense. NOT the capital budget/plan — it is actual capital spent. NOT a single project's
      spending promoted to the agency total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's capital spending from the audited
      financial statements — every business line, never a transit-segment carve-out. For a
      transit division inside a city, use the transit division's own schedule.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual."
    includes:
      - "Vehicle purchases, facility and infrastructure construction, major rehabilitation"
    excludes:
      - "Amortization/depreciation"
      - "Operating expenses"
    labels_en:
      - "Capital expenditure"
      - "Capital spending"
      - "Capital additions"
      - "Investment in capital assets"
    labels_fr:
      - "Dépenses en immobilisations"
      - "Investissements en immobilisations"
      - "Dépenses d'investissement"
    report_location: >-
      Capital-assets note (additions) in the audited statements; capital budget/plan for
      planned (not actual) figures.
    confusions:
      - "Capital expenditure (cash out for assets) vs amortization (non-cash spread)"
      - "Actual capital spent vs the capital budget/plan"
      - "One project/program's capital spend (a COMPONENT) vs the agency-wide total capital expenditure"

  average_fare:
    display_name: Average Fare
    plain_meaning: Revenue collected per rider (boarding).
    definition: >-
      Farebox revenue divided by ridership — the average fare earned per boarding. Uses
      farebox_revenue (passenger fares only), NOT the broad total_revenue_excluding_subsidy,
      so ancillary/investment income never inflates it. A calculated figure, not a posted price.
    is_not: >-
      NOT the posted/advertised adult cash fare. Because it blends passes, concessions, free
      riders and transfers, average fare is typically well BELOW the cash fare. NOT
      total_revenue_excluding_subsidy divided by ridership — that would fold in ancillary and
      capital income and overstate the true per-rider fare.
    source_tier: derived
    entity_scope: >-
      Company-wide: derived from company-wide farebox_revenue and ridership, so it inherits the
      whole-organization scope.
    period_semantics: "Matches its inputs' period (same agency, same period)."
    labels_en:
      - "Average fare"
      - "Revenue per boarding"
      - "Average fare recovery"
    labels_fr:
      - "Tarif moyen"
      - "Recette moyenne par déplacement"
    report_location: "Calculated by TransitIndex; some reports print it in a KPI table as a cross-check."
    confusions:
      - "Average fare (revenue per boarding) vs the posted adult cash fare — very different"
      - "farebox_revenue (the correct numerator) vs the broader total_revenue_excluding_subsidy — using the latter inflates average fare"

  trips_per_revenue_hour:
    display_name: Trips per Revenue Hour
    plain_meaning: Riders carried per hour of service — a productivity measure.
    definition: >-
      Ridership divided by revenue service hours — boardings carried for each hour of service
      supplied. Higher means more productive service.
    is_not: >-
      NOT trips per vehicle and NOT a cost figure. Sensitive to the revenue-hours definition
      (deadhead must be excluded from the denominator).
    source_tier: derived
    period_semantics: "Matches its inputs' period (same agency, same period)."
    labels_en:
      - "Boardings per revenue hour"
      - "Trips per service hour"
      - "Service productivity"
    labels_fr:
      - "Déplacements par heure de service"
      - "Productivité du service"
    report_location: "Calculated by TransitIndex; sometimes printed in a performance KPI table."
    confusions:
      - "Per revenue hour vs per vehicle/per operator"
      - "A single mode's ridership/hours (a COMPONENT pair) vs the system-wide totals used here"

  farebox_recovery_ratio:
    display_name: Farebox Recovery Ratio
    plain_meaning: Share of operating cost covered by fares.
    definition: >-
      Farebox revenue divided by operating expenses — the fraction of the cost of service
      paid for by passenger fares. Uses farebox_revenue as the numerator (NOT the broad
      total_revenue_excluding_subsidy) and the operating-basis operating_expenses (amortization
      excluded) as the denominator.
    is_not: >-
      NOT fares ÷ total cost-including-capital. The result depends on the expense basis
      (amortization included or not); the numerator is fares-only (farebox_revenue), never the
      broad revenue line — keep numerator and denominator on consistent bases.
    source_tier: derived
    entity_scope: >-
      Company-wide: derived from company-wide farebox_revenue and the operating-basis
      operating_expenses, so it inherits the whole-organization scope.
    period_semantics: "Matches its inputs' period; annual for most, quarterly for TransLink."
    labels_en:
      - "Farebox recovery ratio"
      - "Cost recovery (R/C)"
      - "Revenue-to-cost ratio"
      - "Operating ratio"
    labels_fr:
      - "Taux de recouvrement (recettes/dépenses)"
      - "Ratio d'autofinancement"
    report_location: "Calculated by TransitIndex; often printed in a KPI table (store the printed value as a cross-check)."
    confusions:
      - "Fares-only vs all-operating-revenue numerator"
      - "Operating expenses with vs without amortization changes the ratio materially"
      - "farebox_revenue (a COMPONENT of total_revenue_excluding_subsidy) is the correct numerator — using the broader total inflates the ratio"

  cost_per_rider:
    display_name: Cost per Rider
    plain_meaning: Operating cost for each trip taken.
    definition: >-
      Operating expenses divided by ridership — the operating cost of carrying one boarding.
      Lower is generally better.
    is_not: >-
      NOT cost per distinct rider (it is per boarding), and NOT including capital cost unless
      the expense input does.
    source_tier: derived
    entity_scope: >-
      Company-wide: derived from the company-wide operating-basis operating_expenses and
      ridership, so it inherits the whole-organization scope.
    period_semantics: "Matches its inputs' period (same agency, same period)."
    labels_en:
      - "Cost per boarding"
      - "Operating cost per trip"
      - "Cost per passenger trip"
    labels_fr:
      - "Coût par déplacement"
      - "Coût d'exploitation par déplacement"
    report_location: "Calculated by TransitIndex; sometimes printed in a KPI table."
    confusions:
      - "Per boarding vs per distinct rider"
      - "Operating cost only vs cost including capital"
      - "operating_expenses (the total this uses) vs any single object-class COMPONENT (labour, energy, materials)"

  cost_per_hour:
    display_name: Cost per Revenue Hour
    plain_meaning: Operating cost for each hour of service.
    definition: >-
      Operating expenses divided by revenue service hours — the operating cost of supplying
      one hour of service. A standard cost-efficiency benchmark.
    is_not: >-
      NOT cost per total vehicle hour (the denominator excludes deadhead), and NOT a wage rate.
    source_tier: derived
    entity_scope: >-
      Company-wide: derived from the company-wide operating-basis operating_expenses and
      revenue_service_hours, so it inherits the whole-organization scope.
    period_semantics: "Matches its inputs' period (same agency, same period)."
    labels_en:
      - "Cost per revenue hour"
      - "Operating cost per service hour"
      - "Cost per hour"
    labels_fr:
      - "Coût par heure de service"
      - "Coût horaire d'exploitation"
    report_location: "Calculated by TransitIndex; sometimes printed in a KPI table."
    confusions:
      - "Per revenue hour vs per total vehicle hour"
      - "Total operating cost per hour vs the operator wage rate"
      - "operating_expenses (the total this uses) vs any single object-class COMPONENT (labour, energy, materials)"

  subsidy_per_rider:
    display_name: Subsidy per Rider
    plain_meaning: Public subsidy needed for each trip taken.
    definition: >-
      Total operating subsidy divided by ridership — the public funding required per boarding
      after fares and other operating revenue. Equivalent to (operating expenses − operating
      revenue) ÷ ridership.
    is_not: >-
      NOT total cost per rider (that ignores fare revenue), and NOT per distinct rider — it is
      net public subsidy per boarding.
    source_tier: derived
    entity_scope: >-
      Company-wide: derived from the company-wide combined subsidy and ridership, so it
      inherits the whole-organization scope.
    period_semantics: "Matches its inputs' period (same agency, same period)."
    labels_en:
      - "Subsidy per boarding"
      - "Net cost per trip"
      - "Public subsidy per rider"
    labels_fr:
      - "Subvention par déplacement"
      - "Subvention publique par déplacement"
    report_location: "Calculated by TransitIndex from subsidy ÷ ridership."
    confusions:
      - "Subsidy per rider (net of fares) vs cost per rider (gross)"
      - "Per boarding vs per distinct rider"
      - "subsidy (the combined total this uses) vs one government level/program's contribution — a COMPONENT, never the total"

  # --- balance-sheet family (PSAB statement of financial position) ------------
  total_financial_assets:
    display_name: Total Financial Assets
    plain_meaning: Cash, investments, and money owed to the agency — what could become cash.
    definition: >-
      The PSAB total of financial assets — cash, investments, and receivables — the resources
      that could be turned into cash to settle liabilities. The left side of the net-debt identity.
    is_not: >-
      NOT total assets (which also includes non-financial/tangible capital assets), and NOT
      cash alone. A point-in-time figure at fiscal year-end, not a flow. NOT a component line
      (cash_and_investments) promoted to this total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's financial assets from the audited
      statement of financial position — every business line, never a transit-segment
      carve-out. For a transit division inside a city, use the transit division's own schedule,
      never the municipality-wide total.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual (point-in-time, at fiscal year-end); TransLink also reports quarterly."
    includes:
      - "Cash and cash equivalents, investments, accounts receivable"
    excludes:
      - "Tangible capital assets and other non-financial assets"
    labels_en:
      - "Financial assets"
      - "Total financial assets"
    labels_fr:
      - "Actifs financiers"
      - "Total des actifs financiers"
    report_location: "Statement of financial position (top section) in the audited financial statements."
    confusions:
      - "Financial assets vs total assets (financial + non-financial)"
      - "Point-in-time stock vs a flow figure from the statement of operations"
      - "cash_and_investments (a COMPONENT) vs total_financial_assets (the total) — never record the narrower liquidity line as this total"

  total_liabilities:
    display_name: Total Liabilities
    plain_meaning: Everything the agency owes — debt, payables, employee future benefits.
    definition: >-
      The PSAB total of liabilities — debt, accounts payable, deferred revenue, and employee
      future benefits. The right side of the net-debt identity.
    is_not: >-
      NOT long-term debt alone (that is a subset), and NOT net debt (liabilities minus financial
      assets). A point-in-time figure at fiscal year-end. NOT a component line (long_term_debt)
      promoted to this total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's liabilities from the audited statement
      of financial position — every business line, never a transit-segment carve-out. For a
      transit division inside a city, use the transit division's own schedule, never the
      municipality-wide total.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual (point-in-time); TransLink also quarterly."
    includes:
      - "Debt, payables, deferred revenue, employee future benefits"
    excludes:
      - "Net debt (a derived figure, not a liability line)"
    labels_en:
      - "Liabilities"
      - "Total liabilities"
    labels_fr:
      - "Passifs"
      - "Total des passifs"
    report_location: "Statement of financial position in the audited financial statements."
    confusions:
      - "Total liabilities vs long-term debt (a subset)"
      - "Liabilities vs net debt"
      - "long_term_debt (a COMPONENT) vs total_liabilities (the total) — never record the debt-only line as this total"

  total_non_financial_assets:
    display_name: Total Non-Financial Assets
    plain_meaning: Assets the agency uses rather than sells — mainly vehicles, buildings, equipment.
    definition: >-
      The PSAB total of non-financial assets — chiefly tangible capital assets (net book value)
      plus inventories and prepaid expenses. Assets held for use in service delivery, not to be
      converted to cash.
    is_not: >-
      NOT financial assets, and NOT only tangible capital assets (it also includes inventories and
      prepaids). A point-in-time figure. NOT a component line (tangible_capital_assets) promoted
      to this total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's non-financial assets from the audited
      statement of financial position — every business line, never a transit-segment
      carve-out. For a transit division inside a city, use the transit division's own schedule,
      never the municipality-wide total.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual (point-in-time); TransLink also quarterly."
    includes:
      - "Tangible capital assets (net), inventories, prepaid expenses"
    excludes:
      - "Cash, investments, receivables (those are financial assets)"
    labels_en:
      - "Non-financial assets"
      - "Total non-financial assets"
    labels_fr:
      - "Actifs non financiers"
      - "Total des actifs non financiers"
    report_location: "Statement of financial position (non-financial assets section)."
    confusions:
      - "Non-financial assets vs tangible capital assets (TCA is the largest component)"
      - "tangible_capital_assets (a COMPONENT) vs total_non_financial_assets (the total) — never record the TCA-only line as this total"

  total_assets:
    display_name: Total Assets
    plain_meaning: Everything the agency owns (financial + non-financial combined).
    definition: >-
      The headline total of all assets — financial assets plus non-financial assets. Equal by
      identity to total_financial_assets + total_non_financial_assets.
    is_not: >-
      NOT net of liabilities (that is accumulated surplus), and NOT financial assets alone. A
      point-in-time figure. NOT one of its two components (total_financial_assets or
      total_non_financial_assets) promoted to this total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's total assets from the audited statement
      of financial position — every business line, never a transit-segment carve-out. For a
      transit division inside a city, use the transit division's own schedule, never the
      municipality-wide total.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual (point-in-time); TransLink also quarterly."
    includes:
      - "Financial assets + non-financial assets"
    excludes:
      - "Any netting of liabilities"
    labels_en:
      - "Total assets"
    labels_fr:
      - "Total de l'actif"
      - "Total des actifs"
    report_location: "Statement of financial position (sum line), or computed from its sections."
    confusions:
      - "Total assets vs accumulated surplus (assets net of liabilities)"
      - "total_financial_assets or total_non_financial_assets alone (each a COMPONENT) vs total_assets (their sum)"

  tangible_capital_assets:
    display_name: Tangible Capital Assets
    plain_meaning: Net book value of vehicles, buildings, track and equipment (after depreciation).
    definition: >-
      The net book value (cost less accumulated amortization) of tangible capital assets — buses,
      trains, track, facilities, equipment. The largest component of non-financial assets.
    is_not: >-
      NOT gross/historical cost (it is net of accumulated amortization), and NOT capital
      expenditure (a flow). A point-in-time stock. It is a COMPONENT of
      total_non_financial_assets, never the total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's tangible capital assets from the audited
      statement of financial position — every business line, never a transit-segment
      carve-out. For a transit division inside a city, use the transit division's own schedule.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual (point-in-time); TransLink also quarterly."
    includes:
      - "Net book value of vehicles, facilities, track, equipment"
    excludes:
      - "Gross cost before amortization"
      - "Capital expenditure (the period's additions)"
    labels_en:
      - "Tangible capital assets"
      - "Capital assets (net)"
      - "TCA"
    labels_fr:
      - "Immobilisations corporelles"
      - "Valeur comptable nette des immobilisations"
    report_location: "Tangible capital assets note (net book value) in the audited statements."
    confusions:
      - "Net book value vs gross/historical cost"
      - "TCA (a stock) vs capital expenditure (the year's additions)"
      - "A COMPONENT of total_non_financial_assets vs the total_non_financial_assets total itself"

  accumulated_surplus:
    display_name: Accumulated Surplus
    plain_meaning: The agency's bottom-line net worth, built up over time (assets − liabilities).
    definition: >-
      The PSAB accumulated surplus — the agency's net economic position, equal by identity to
      total assets minus total liabilities (equivalently net financial assets plus non-financial
      assets). The bottom line of the statement of financial position.
    is_not: >-
      NOT the annual surplus/deficit (a single year's flow), and NOT cash. A cumulative
      point-in-time figure.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's accumulated surplus from the audited
      statement of financial position — every business line, never a transit-segment
      carve-out. For a transit division inside a city, use the transit division's own schedule.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual (point-in-time); TransLink also quarterly."
    includes:
      - "Cumulative net position to date"
    excludes:
      - "The single-year surplus/deficit"
    labels_en:
      - "Accumulated surplus"
      - "Net position"
    labels_fr:
      - "Excédent accumulé"
      - "Surplus accumulé"
    report_location: "Statement of financial position (bottom line) in the audited statements."
    confusions:
      - "Accumulated surplus (cumulative) vs annual surplus/deficit (one year)"
      - "The bottom-line identity total vs any single asset/liability line that feeds it"

  long_term_debt:
    display_name: Long-Term Debt
    plain_meaning: Money borrowed that is repaid over more than a year (bonds, loans).
    definition: >-
      Borrowing with maturity beyond one year — debentures, bonds, and long-term loans. A subset
      of total liabilities.
    is_not: >-
      NOT total liabilities (it excludes payables, deferred revenue, employee benefits), and NOT
      net debt. It is a COMPONENT of total_liabilities, never the total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's long-term debt from the audited
      statement of financial position — every business line, never a transit-segment
      carve-out. For a transit division inside a city, use the transit division's own schedule.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual (point-in-time); TransLink also quarterly."
    includes:
      - "Debentures, bonds, long-term loans"
    excludes:
      - "Short-term payables and other liabilities"
    labels_en:
      - "Long-term debt"
      - "Debt"
    labels_fr:
      - "Dette à long terme"
      - "Emprunts à long terme"
    report_location: "Long-term debt note in the audited financial statements."
    confusions:
      - "Long-term debt vs total liabilities (the broader figure)"
      - "A COMPONENT of total_liabilities vs the total_liabilities total itself"

  cash_and_investments:
    display_name: Cash & Investments
    plain_meaning: Cash on hand plus investments — the agency's liquidity.
    definition: >-
      Cash, cash equivalents, and investments — the most liquid portion of financial assets. A
      liquidity signal.
    is_not: >-
      NOT total financial assets (which also includes receivables), and NOT total assets. It is
      a COMPONENT of total_financial_assets, never the total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization's cash and investments from the audited
      statement of financial position — every business line, never a transit-segment
      carve-out. For a transit division inside a city, use the transit division's own schedule.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the
      whole-dollar CAD amount.
    period_semantics: "Annual (point-in-time); TransLink also quarterly."
    includes:
      - "Cash, cash equivalents, short- and long-term investments"
    excludes:
      - "Accounts receivable and other financial assets"
    labels_en:
      - "Cash and investments"
      - "Cash and cash equivalents"
    labels_fr:
      - "Trésorerie et placements"
      - "Encaisse et placements"
    report_location: "Statement of financial position / cash and investments note."
    confusions:
      - "Cash and investments vs total financial assets (the broader figure)"
      - "A COMPONENT of total_financial_assets vs the total_financial_assets total itself"

  net_debt:
    display_name: Net Debt
    plain_meaning: What the agency owes beyond what its financial assets cover (lower is healthier).
    definition: >-
      Total liabilities minus total financial assets — the PSAB net debt indicator. Positive net
      debt means liabilities exceed the financial assets available to settle them. We also store
      the agency's printed net debt as a cross-check.
    is_not: >-
      NOT long-term debt, and NOT total liabilities. It is a derived net figure; a NEGATIVE result
      is "net financial assets" (healthier).
    source_tier: derived
    entity_scope: >-
      Company-wide: derived from company-wide total_liabilities and total_financial_assets, so
      it inherits the whole-organization scope.
    period_semantics: "Matches its inputs' period (annual; quarterly for TransLink)."
    labels_en:
      - "Net debt"
      - "Net financial assets (if negative)"
    labels_fr:
      - "Dette nette"
      - "Actifs financiers nets (si négatif)"
    report_location: "Computed; the printed net debt rides in the value's cross-check field."
    confusions:
      - "Net debt vs total liabilities or long-term debt"
      - "A bigger agency has a bigger net debt — it is NOT ranked across agencies"
      - "total_liabilities/total_financial_assets (the totals this uses) vs their COMPONENT lines (long_term_debt, cash_and_investments)"

  debt_to_assets:
    display_name: Debt to Assets
    plain_meaning: Share of everything the agency owns that is financed by what it owes.
    definition: >-
      Total liabilities divided by total assets — a scale-free leverage ratio.
    is_not: >-
      NOT net debt per capita, and NOT a dollar figure. Lower generally indicates lower leverage.
      NOT ranked: the rated set is the five Highlights hero metrics (ridership,
      total_revenue_excluding_subsidy, on_time_performance, cost_per_rider,
      subsidy_per_rider) — this metric's ranking was retired (metric-set-build-plan.md Phase 1).
    source_tier: derived
    entity_scope: >-
      Company-wide: derived from company-wide total_liabilities and total_assets, so it
      inherits the whole-organization scope.
    period_semantics: "Matches its inputs' period (annual; quarterly for TransLink)."
    labels_en:
      - "Debt-to-assets ratio"
      - "Liabilities-to-assets"
      - "Leverage ratio"
    labels_fr:
      - "Ratio dette/actif"
      - "Ratio d'endettement"
    report_location: "Computed by TransitIndex from total liabilities ÷ total assets."
    confusions:
      - "Debt-to-assets (uses total liabilities) vs a long-term-debt-only leverage measure"
      - "total_liabilities (the total this uses) vs long_term_debt (a COMPONENT)"

  net_debt_per_capita:
    display_name: Net Debt per Capita
    plain_meaning: Net debt divided by the population the agency serves — debt per resident.
    definition: >-
      Net debt divided by the agency's service-area population — the civic headline that makes
      net debt comparable across agencies of different sizes. Population is the static
      service-area population, labelled "per resident served".
    is_not: >-
      NOT net debt itself (a raw dollar that is not ranked), and NOT per rider. The denominator is
      population served, not ridership. NOT ranked: the rated set is the five Highlights hero
      metrics (ridership, total_revenue_excluding_subsidy, on_time_performance, cost_per_rider,
      subsidy_per_rider) — this metric's ranking was retired (metric-set-build-plan.md Phase 1).
    source_tier: derived
    entity_scope: >-
      Company-wide: derived from company-wide net_debt, so it inherits the whole-organization
      scope.
    period_semantics: "Matches the net-debt period; population is a static agency attribute."
    labels_en:
      - "Net debt per capita"
      - "Net debt per resident"
    labels_fr:
      - "Dette nette par habitant"
      - "Dette nette par résident"
    report_location: "Computed by TransitIndex from net debt ÷ service-area population."
    confusions:
      - "Per capita (population served) vs per rider (ridership)"
      - "Uses net debt, not total liabilities or long-term debt"
      - "net_debt (the derived total this uses) vs its COMPONENT lines (total_liabilities, total_financial_assets)"

  # --- financial-statement additions (metric-set-build-plan.md Phase 4) --------
  amortization:
    display_name: Amortization
    plain_meaning: The non-cash charge that spreads the cost of capital assets over their life.
    definition: >-
      The annual amortization/depreciation expense — the non-cash charge that spreads the cost
      of tangible capital assets (vehicles, facilities, track) over their useful lives. Printed
      as an expense line on the statement of operations. It is the reconciling item between the
      PSAB total operating expense (amortization included) and the CUTA/NTD operating basis
      (amortization excluded): operating basis = operating_expenses − amortization.
    is_not: >-
      NOT capital expenditure (the cash spent buying assets — amortization is the later non-cash
      spread of that cost), and NOT accumulated amortization (the balance-sheet stock to date).
      It is a single year's expense, not a stock.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the amortization for the entire reporting organization from the audited
      financial statements. For a transit division inside a city (Calgary Transit, Edmonton ETS,
      Hamilton HSR) use the transit division's own schedule, never the municipality-wide figure.
    scale_note: >-
      Statements often print figures in thousands ($000s) or millions ($M); record the whole-dollar
      CAD amount (e.g. "$4,231 (thousands)" is recorded as 4231000).
    period_semantics: "Annual (a flow over the year)."
    includes:
      - "Amortization/depreciation of tangible capital assets for the year"
    excludes:
      - "Capital expenditure (the cash cost of acquiring assets)"
      - "Accumulated amortization (the cumulative balance-sheet figure)"
    labels_en:
      - "Amortization"
      - "Depreciation"
      - "Amortization of tangible capital assets"
      - "Depreciation and amortization"
    labels_fr:
      - "Amortissement"
      - "Amortissement des immobilisations corporelles"
      - "Dotation aux amortissements"
    report_location: >-
      Statement of operations (as an expense line) and the expenses-by-object note; also
      reconciled in the tangible capital assets note.
    confusions:
      - "Amortization (non-cash expense) vs capital expenditure (cash out to buy assets)"
      - "This year's amortization expense vs accumulated amortization (the cumulative stock)"
      - "Whether operating_expenses includes it (PSAB) or excludes it (CUTA operating basis)"

  other_operating_expenses:
    display_name: Other Operating Expenses
    plain_meaning: Operating costs that are not labour, energy/fuel, materials/services, or amortization.
    definition: >-
      The residual "other" operating-expense object class — insurance/casualty, purchased
      transportation, taxes, and miscellaneous operating costs not captured by labour, energy/fuel,
      materials & services, or amortization. Its purpose is to let the expense components sum to
      operating_expenses (PSAB basis) so no residual is forced into materials & services.
    is_not: >-
      NOT capital expenditure, NOT amortization (its own line), and NOT a catch-all for
      mis-bucketed labour, energy, or materials — only the genuinely "other" object class belongs
      here. It is a component of operating_expenses, never the total.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the whole reporting organization from the audited statements (the transit
      division's schedule for a transit-as-a-city-division agency), never a segment carve-out.
    scale_note: >-
      Record whole-dollar CAD; statements printed in $000s or $M must be scaled up to whole dollars.
    period_semantics: "Annual."
    includes:
      - "Insurance/casualty, purchased transportation, taxes, and miscellaneous operating costs"
    excludes:
      - "Labour, energy/fuel, materials & services, amortization (their own lines)"
      - "Capital expenditure"
    labels_en:
      - "Other operating expenses"
      - "Other expenses"
      - "Miscellaneous operating costs"
      - "Insurance and other"
    labels_fr:
      - "Autres charges d'exploitation"
      - "Autres dépenses d'exploitation"
      - "Divers"
    report_location: "Expenses-by-object note in the audited financial statements."
    confusions:
      - "A component of operating_expenses vs the operating_expenses total itself"
      - "Genuinely-other costs vs mis-bucketed labour/energy/materials"
      - "Operating 'other' vs capital purchases"

  total_revenue:
    display_name: Total Revenue
    plain_meaning: All money the organization took in — fares, other revenue, and government subsidy combined.
    definition: >-
      The audited PSAB statement-of-operations total revenue — the whole enterprise's revenue,
      equal to total_revenue_excluding_subsidy + subsidy. The enterprise-lens "how big" figure:
      it deliberately includes government operating transfers and any capital-contribution
      amortization recognized as revenue.
    is_not: >-
      NOT operating/earned revenue (that is total_revenue_excluding_subsidy, which excludes
      subsidy), and NOT fares only. It is the broad statement total; a bigger number here means a
      bigger organization, not a more self-funding one — do not use it as the farebox-recovery
      numerator.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the audited entity total for the whole reporting organization (conventional +
      specialized + every business line). For multi-division agencies (TransLink incl.
      roads/bridges, Metrolinx incl. GO + UP + PRESTO) use the audited entity total, not a transit
      segment carve-out. For a transit division inside a city, use the transit division's schedule,
      never the municipality-wide total.
    scale_note: >-
      Record whole-dollar CAD; scale up figures printed in thousands or millions.
    period_semantics: "Annual (statement of operations)."
    includes:
      - "Fares + other earned revenue + government operating subsidy/transfers"
      - "Any capital-contribution amortization recognized as revenue under PSAB"
    excludes:
      - "Nothing on the revenue side — this is the audited total"
    labels_en:
      - "Total revenue"
      - "Total revenues"
      - "Revenue (total)"
    labels_fr:
      - "Total des revenus"
      - "Produits totaux"
      - "Total des produits"
    report_location: "Statement of operations (total revenue line) in the audited financial statements."
    confusions:
      - "Total revenue (incl. subsidy) vs total_revenue_excluding_subsidy (earned, excl. subsidy)"
      - "Enterprise scale vs self-funding — a big total_revenue is mostly subsidy for transfer-heavy agencies"

  farebox_revenue:
    display_name: Farebox Revenue
    plain_meaning: Money riders themselves pay in fares.
    definition: >-
      Passenger fare revenue only — cash, passes, and concession fares paid by riders. The honest
      numerator for farebox recovery and average fare, kept narrow so those ratios are not inflated
      by ancillary or capital income.
    is_not: >-
      NOT total_revenue_excluding_subsidy (which is the broader "all revenue except subsidy",
      including advertising/charter/investment income), NOT total revenue, and NOT subsidy.
      Third-party fare-program reimbursements (One Fare, U-Pass) are SUBSIDY, not farebox revenue —
      they do not belong here.
    source_tier: annual_report
    entity_scope: >-
      Company-wide: fares for the whole reporting organization (the transit division's schedule for
      a transit-as-a-city-division agency), not a single route or segment.
    scale_note: >-
      Record whole-dollar CAD; scale up figures printed in $000s or $M.
    period_semantics: >-
      Monthly for the farebox portion at large agencies (StatCan); otherwise annual from the audited
      statement of operations.
    includes:
      - "Passenger fares: cash, passes, concession and student fares"
    excludes:
      - "Ancillary operating income (advertising, charter, fees) — that is other_revenue"
      - "Government subsidy and third-party fare-program reimbursements (One Fare, U-Pass)"
      - "Capital and investment income"
    labels_en:
      - "Farebox revenue"
      - "Passenger fare revenue"
      - "Fare revenue"
      - "Transit fares"
    labels_fr:
      - "Recettes tarifaires"
      - "Recettes de la clientèle"
      - "Revenus des passagers"
    report_location: >-
      Statement of operations / revenue note (fare-revenue line); farebox and ridership tables.
    confusions:
      - "Farebox revenue (fares only) vs total_revenue_excluding_subsidy (fares + other earned revenue)"
      - "Fares vs One Fare / U-Pass reimbursements, which are subsidy — never farebox"
      - "Fares vs advertising/charter income (that is other_revenue)"

  total_expenses:
    display_name: Total Expenses
    plain_meaning: All costs the organization incurred, including amortization.
    definition: >-
      The audited PSAB statement-of-operations total expenses for the whole enterprise —
      operating costs plus amortization. The enterprise-lens expense figure that pairs with
      total_revenue to give the annual surplus/deficit.
    is_not: >-
      NOT operating_expenses on the CUTA operating basis (which excludes amortization) — this is
      the full audited total. NOT capital expenditure (a separate cash-flow / TCA-additions item).
    source_tier: annual_report
    entity_scope: >-
      Company-wide: the audited entity total for the whole reporting organization; for multi-division
      agencies use the entity total (no segment carve-outs), and for a transit division inside a city
      use the transit division's schedule, never the municipality-wide total.
    scale_note: >-
      Record whole-dollar CAD; scale up figures printed in thousands or millions.
    period_semantics: "Annual (statement of operations)."
    includes:
      - "All operating costs plus amortization for the whole organization"
    excludes:
      - "Capital expenditure (a separate item, not an operating-statement expense)"
    labels_en:
      - "Total expenses"
      - "Total expenditures"
      - "Expenses (total)"
    labels_fr:
      - "Total des charges"
      - "Total des dépenses"
      - "Charges totales"
    report_location: "Statement of operations (total expenses line) in the audited financial statements."
    confusions:
      - "Total expenses (incl. amortization) vs operating_expenses on the CUTA basis (excl. amortization)"
      - "Total expenses (a flow) vs capital expenditure or total liabilities"

  other_revenue:
    display_name: Other Revenue
    plain_meaning: Earned revenue that is not fares and not government subsidy.
    definition: >-
      The broad non-fare, non-subsidy earned-revenue residual — advertising, charter, fees,
      investment income, and any capital-contribution revenue swept into the earned side. Defined
      so farebox_revenue + other_revenue = total_revenue_excluding_subsidy (the StatCan
      "total revenue, excluding subsidies" line). Computed by TransitIndex as the residual.
    is_not: >-
      NOT government subsidy (that is its own line and is excluded from total_revenue_excluding_subsidy),
      and NOT passenger fares (that is farebox_revenue). It is deliberately broad on the earned side.
    source_tier: derived
    entity_scope: >-
      Company-wide: it is the residual of two company-wide figures (total_revenue_excluding_subsidy
      and farebox_revenue), so it inherits the whole-organization scope.
    scale_note: >-
      A derived whole-dollar CAD figure; inherits the scale of its sourced inputs.
    period_semantics: "Matches its inputs' period (same agency, same period)."
    includes:
      - "Advertising, charter, fees, investment income, and other non-fare earned revenue"
    excludes:
      - "Passenger fares (farebox_revenue)"
      - "Government operating subsidy/transfers"
    labels_en:
      - "Other revenue"
      - "Non-fare revenue"
      - "Ancillary revenue"
    labels_fr:
      - "Autres revenus"
      - "Revenus divers"
      - "Produits accessoires"
    report_location: >-
      Computed by TransitIndex as total_revenue_excluding_subsidy − farebox_revenue; some reports
      print an "other revenue" line as a cross-check.
    confusions:
      - "Other (non-fare) revenue vs government subsidy — subsidy is never part of other_revenue"
      - "The broad earned residual vs a specific ancillary line"

  annual_surplus_deficit:
    display_name: Annual Surplus / (Deficit)
    plain_meaning: Whether the organization ended the year up (surplus) or down (deficit).
    definition: >-
      The bottom line of the statement of operations — total_revenue minus total_expenses for the
      year. The bridge from the operating statement to the balance sheet: accumulated_surplus(end)
      = accumulated_surplus(start) + annual_surplus_deficit. Computed by TransitIndex from the two
      enterprise totals.
    is_not: >-
      NOT accumulated surplus (the cumulative net position on the balance sheet — this is one
      year's flow), and NOT the operating gap covered by subsidy. A NEGATIVE value is a deficit
      (expenses exceeded revenue); a positive value is a surplus.
    source_tier: derived
    entity_scope: >-
      Company-wide: derived from company-wide total_revenue and total_expenses, so it is the whole
      organization's annual result.
    scale_note: >-
      A derived whole-dollar CAD figure (can be negative — a deficit).
    period_semantics: "Matches its inputs' period (annual)."
    includes:
      - "The single year's revenue-minus-expenses result for the whole organization"
    excludes:
      - "The cumulative accumulated surplus (a balance-sheet stock)"
    labels_en:
      - "Annual surplus"
      - "Annual surplus (deficit)"
      - "Annual deficit"
      - "Surplus / (deficit) for the year"
    labels_fr:
      - "Excédent annuel"
      - "Excédent (déficit) de l'exercice"
      - "Résultat de l'exercice"
    report_location: >-
      Statement of operations (bottom line); computed by TransitIndex from total_revenue −
      total_expenses.
    confusions:
      - "Annual surplus/deficit (one year's flow) vs accumulated surplus (the cumulative stock)"
      - "A negative value means a DEFICIT (expenses > revenue), not a data error"

  other_financial_assets:
    display_name: Other Financial Assets
    plain_meaning: Financial assets other than cash and investments — mainly receivables.
    definition: >-
      The residual within financial assets: total_financial_assets minus cash_and_investments —
      chiefly accounts receivable and other short-term financial assets. Defined so
      cash_and_investments + other_financial_assets = total_financial_assets. Computed by
      TransitIndex as the residual.
    is_not: >-
      NOT total_financial_assets (it is only the non-cash portion), and NOT non-financial/tangible
      capital assets. A point-in-time stock, not a flow. A negative residual means the components
      exceed the total — flag it, do not record a negative "other".
    source_tier: derived
    entity_scope: >-
      Company-wide: the residual of two company-wide balance-sheet figures, so it is the whole
      organization's figure.
    scale_note: >-
      A derived whole-dollar CAD point-in-time figure.
    period_semantics: "Matches its inputs' period (annual, point-in-time at fiscal year-end)."
    includes:
      - "Accounts receivable and other financial assets that are not cash or investments"
    excludes:
      - "Cash and investments (cash_and_investments)"
      - "Non-financial / tangible capital assets"
    labels_en:
      - "Other financial assets"
      - "Receivables and other financial assets"
    labels_fr:
      - "Autres actifs financiers"
      - "Débiteurs et autres actifs financiers"
    report_location: >-
      Computed by TransitIndex as total_financial_assets − cash_and_investments (both from the
      statement of financial position).
    confusions:
      - "A component of total_financial_assets vs the total itself"
      - "cash_and_investments vs total_financial_assets — other_financial_assets is the gap between them"

  other_liabilities:
    display_name: Other Liabilities
    plain_meaning: Liabilities other than long-term debt — payables, deferred revenue, employee benefits.
    definition: >-
      The residual within liabilities: total_liabilities minus long_term_debt — accounts payable,
      deferred revenue, and employee future benefits. Defined so long_term_debt + other_liabilities
      = total_liabilities. Computed by TransitIndex as the residual.
    is_not: >-
      NOT total_liabilities (it is only the non-long-term-debt portion), and NOT net debt. A
      point-in-time stock. A negative residual means the components exceed the total — flag it.
    source_tier: derived
    entity_scope: >-
      Company-wide: the residual of two company-wide balance-sheet figures, so it is the whole
      organization's figure.
    scale_note: >-
      A derived whole-dollar CAD point-in-time figure.
    period_semantics: "Matches its inputs' period (annual, point-in-time at fiscal year-end)."
    includes:
      - "Accounts payable, deferred revenue, employee future benefits, other liabilities"
    excludes:
      - "Long-term debt (long_term_debt)"
      - "Net debt (a derived figure, not a liability line)"
    labels_en:
      - "Other liabilities"
      - "Accounts payable and other liabilities"
    labels_fr:
      - "Autres passifs"
      - "Créditeurs et autres passifs"
    report_location: >-
      Computed by TransitIndex as total_liabilities − long_term_debt (both from the statement of
      financial position).
    confusions:
      - "A component of total_liabilities vs the total_liabilities total itself"
      - "long_term_debt vs total_liabilities — other_liabilities is the gap between them"

  other_non_financial_assets:
    display_name: Other Non-Financial Assets
    plain_meaning: Non-financial assets other than tangible capital assets — inventories, prepaids.
    definition: >-
      The residual within non-financial assets: total_non_financial_assets minus
      tangible_capital_assets — chiefly inventories and prepaid expenses. Defined so
      tangible_capital_assets + other_non_financial_assets = total_non_financial_assets. Computed
      by TransitIndex as the residual.
    is_not: >-
      NOT total_non_financial_assets (it is only the non-TCA portion), and NOT financial assets
      (cash, investments, receivables). A point-in-time stock. A negative residual means the
      components exceed the total — flag it.
    source_tier: derived
    entity_scope: >-
      Company-wide: the residual of two company-wide balance-sheet figures, so it is the whole
      organization's figure.
    scale_note: >-
      A derived whole-dollar CAD point-in-time figure.
    period_semantics: "Matches its inputs' period (annual, point-in-time at fiscal year-end)."
    includes:
      - "Inventories, prepaid expenses, and other non-financial assets"
    excludes:
      - "Tangible capital assets (tangible_capital_assets)"
      - "Financial assets (cash, investments, receivables)"
    labels_en:
      - "Other non-financial assets"
      - "Inventories and prepaid expenses"
    labels_fr:
      - "Autres actifs non financiers"
      - "Stocks et charges payées d'avance"
    report_location: >-
      Computed by TransitIndex as total_non_financial_assets − tangible_capital_assets (both from
      the statement of financial position).
    confusions:
      - "A component of total_non_financial_assets vs the total itself"
      - "tangible_capital_assets vs total_non_financial_assets — this is the gap between them"
